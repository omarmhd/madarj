# Builds the Android app in the cloud, so nothing needs installing locally.
#
# Every push that touches the app builds a test APK. Download it from the
# run's "Artifacts" section on GitHub and install it on a phone.
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'capacitor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # The app opens the live site, so only the native shell is synced
      - run: npx cap sync android

      - name: Build the test APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: madarij-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
